<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shoreline Projections - Interactive Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Leaflet providers -->
  <script src="https://unpkg.com/leaflet-providers@1.3.0/leaflet-providers.js"></script>

  <!-- Chart.js for time series -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body, #map {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Map controls */
    .map-container {
      display: flex;
      height: 100%;
    }

    #map {
      flex: 1;
    }

    /* Info panel */
    .info-panel {
      width: 700px;
      background: white;
      box-shadow: -2px 0 5px rgba(0,0,0,0.1);
      overflow-y: auto;
      position: relative;
    }

    .panel-header {
      padding: 15px;
      border-bottom: 2px solid #007bff;
      background: #f8f9fa;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .panel-header h2 {
      font-size: 16px;
      color: #333;
      margin-bottom: 5px;
    }

    .panel-header p {
      font-size: 12px;
      color: #666;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #666;
    }

    .close-btn:hover {
      color: #000;
    }

    .panel-content {
      padding: 15px;
    }

    .scenario-container {
      margin-bottom: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 5px;
      border-left: 4px solid #007bff;
    }

    .scenario-title {
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .scenario-select {
      width: 100%;
      padding: 6px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 3px;
      font-size: 12px;
    }

    .chart-container {
      position: relative;
      height: 250px;
      margin-bottom: 15px;
    }

    .data-table {
      width: 100%;
      font-size: 11px;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .data-table th,
    .data-table td {
      padding: 6px;
      border: 1px solid #ddd;
      text-align: right;
    }

    .data-table th {
      background: #e9ecef;
      font-weight: bold;
    }

    .data-table tr:nth-child(even) {
      background: #f9f9f9;
    }

    .legend {
      font-size: 11px;
      margin-top: 10px;
      padding: 10px;
      background: white;
      border-radius: 3px;
      border: 1px solid #ddd;
    }

    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }

    .legend-color {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      margin-right: 8px;
    }

    /* Hidden state */
    #infoPanel.hidden {
      display: none;
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .map-container {
        flex-direction: column;
      }

      .info-panel {
        width: 100%;
        height: 40%;
        box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
      }

      #map {
        height: 60%;
      }
    }

    /* Point styling */
    .leaflet-marker-icon {
      border-radius: 50% !important;
    }

    .marker-active {
      filter: drop-shadow(0 0 8px rgba(0, 123, 255, 0.8));
    }

    .intro-message {
      padding: 20px;
      text-align: center;
      color: #666;
    }

    .intro-message h3 {
      color: #333;
      margin-bottom: 10px;
    }

    .map-colorbar {
      background: rgba(255, 255, 255, 0.95);
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      min-width: 210px;
      font-size: 11px;
      line-height: 1.3;
    }

    .map-colorbar-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }

    .map-colorbar-scale {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .map-colorbar-gradient {
      width: 16px;
      height: 140px;
      border: 1px solid #bbb;
      border-radius: 2px;
      background: linear-gradient(
        to top,
        #b2182b 0%,
        #d6604d 20%,
        #f7f7f7 50%,
        #4393c3 80%,
        #2166ac 100%
      );
    }

    .map-colorbar-labels {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 140px;
      color: #333;
    }

    .map-colorbar-note {
      margin-top: 8px;
      color: #444;
    }
  </style>
</head>
<body>

  <div class="map-container">
    <div id="map"></div>
    <div id="infoPanel" class="info-panel hidden">
      <div class="panel-header">
        <h2 id="panelTitle">Select a point</h2>
        <p id="panelSubtitle"></p>
        <button class="close-btn" onclick="closePanel()">×</button>
      </div>
      <div class="panel-content">
        <div id="panelBody">
          <div class="intro-message">
            <h3>Click on a geographic point on the map to view projections</h3>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Global state
    let map;
    let markers = {};
    let projectionsData = {};
    let currentTransectId = null;
    let currentChart = null;
    let activeScenarioKey = null;
    let normalizedChangeByTransect = {};
    let colorScaleLimit = 10;

    const TARGET_SCENARIO_HINT = 'compound';
    const BASELINE_YEAR = 2025;
    const TARGET_YEAR = 2050;
    const STABILITY_THRESHOLD = 3;
    const FIXED_COLOR_SCALE_LIMIT = 10;

    // Initialize map
    function initMap() {
      map = L.map('map').setView([-40.5, 172.5], 6);
      
      // Add base layer
      L.tileLayer.provider('CartoDB.Positron').addTo(map);

      // Load data
      loadProjectionsData()
        .then(() => {
          addColorbarControl();
          return loadPointsData();
        })
        .catch(error => console.error('Error initializing dashboard data:', error));
    }

    // Load projections data from JSON
    function loadProjectionsData() {
      return fetch('data/projections.json')
        .then(response => response.json())
        .then(data => {
          projectionsData = data;
          const scenarioKey = resolveScenarioKey(data);
          activeScenarioKey = scenarioKey;
          normalizedChangeByTransect = computeNormalizedChangeForAllTransects(data, scenarioKey);
          colorScaleLimit = FIXED_COLOR_SCALE_LIMIT;
          console.log('Loaded projections for', Object.keys(data).length, 'transects');
          console.log('Using scenario key for normalized mapping:', scenarioKey);
          console.log('Fixed symmetric color scale limit (+/-m):', colorScaleLimit);
        })
        .catch(error => console.error('Error loading projections:', error));
    }

    // Load GeoJSON points
    function loadPointsData() {
      return fetch('preprocessing/points_ref_shoreline_2025.geojson')
        .then(response => response.json())
        .then(geojson => {
          L.geoJSON(geojson, {
            pointToLayer: (feature, latlng) => {
              const transectId = feature.properties.transect_id;
              const delta = normalizedChangeByTransect[transectId];
              const marker = L.circleMarker(latlng, {
                radius: 5,
                fillColor: getMarkerColor(delta),
                color: '#fff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.7,
                cursor: 'pointer'
              });

              marker.bindTooltip(transectId, { 
                permanent: false,
                direction: 'top',
                offset: [0, -10]
              });

              marker.on('click', () => showProjections(transectId, feature.properties));
              markers[transectId] = marker;
              return marker;
            }
          }).addTo(map);
        })
        .catch(error => console.error('Error loading GeoJSON:', error));
    }

    // Check if transect has projections data
    function hasProjections(transectId) {
      return projectionsData.hasOwnProperty(transectId);
    }

    function resolveScenarioKey(data) {
      const transectIds = Object.keys(data);
      if (transectIds.length === 0) {
        return null;
      }

      for (const transectId of transectIds) {
        const scenarioKeys = Object.keys((data[transectId] && data[transectId].scenarios) || {});
        const compoundKey = scenarioKeys.find(key => key.toLowerCase().includes(TARGET_SCENARIO_HINT));
        if (compoundKey) {
          return compoundKey;
        }
      }

      const firstScenario = Object.keys((data[transectIds[0]] && data[transectIds[0]].scenarios) || {})[0] || null;
      if (firstScenario) {
        console.warn('Compound scenario key not found. Falling back to first available scenario:', firstScenario);
      }
      return firstScenario;
    }

    function computeNormalizedChangeForAllTransects(data, scenarioKey) {
      const deltas = {};
      Object.entries(data).forEach(([transectId, transectData]) => {
        const scenarioSeries = transectData.scenarios && transectData.scenarios[scenarioKey];
        if (!scenarioSeries || !Array.isArray(scenarioSeries)) {
          return;
        }

        const projectionSeries = scenarioSeries.filter(d => !d.series_type || d.series_type === 'projection');
        if (projectionSeries.length === 0) {
          return;
        }

        const baselineRecord = projectionSeries.find(d => Number(d.year) === BASELINE_YEAR);
        const targetRecord = projectionSeries.find(d => Number(d.year) === TARGET_YEAR);
        if (!baselineRecord || !targetRecord) {
          return;
        }

        const baseline = Number(baselineRecord.proj_shoreline_mean);
        const target = Number(targetRecord.proj_shoreline_mean);
        if (Number.isFinite(baseline) && Number.isFinite(target)) {
          deltas[transectId] = target - baseline;
        }
      });
      return deltas;
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function interpolateRgb(colorA, colorB, t) {
      const clamped = clamp(t, 0, 1);
      const r = Math.round(colorA[0] + (colorB[0] - colorA[0]) * clamped);
      const g = Math.round(colorA[1] + (colorB[1] - colorA[1]) * clamped);
      const b = Math.round(colorA[2] + (colorB[2] - colorA[2]) * clamped);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function getMarkerColor(delta) {
      if (!Number.isFinite(delta)) {
        return '#999';
      }

      const limited = clamp(delta, -colorScaleLimit, colorScaleLimit);
      if (limited < 0) {
        const t = (limited + colorScaleLimit) / colorScaleLimit;
        return interpolateRgb([178, 24, 43], [247, 247, 247], t);
      }
      const t = limited / colorScaleLimit;
      return interpolateRgb([247, 247, 247], [33, 102, 172], t);
    }

    function describeStability(delta) {
      if (!Number.isFinite(delta)) {
        return 'No normalized change available';
      }
      if (delta < -STABILITY_THRESHOLD) {
        return 'Eroding';
      }
      if (delta > STABILITY_THRESHOLD) {
        return 'Accreting';
      }
      return 'Stable';
    }

    function addColorbarControl() {
      const control = L.control({ position: 'bottomleft' });
      control.onAdd = function() {
        const div = L.DomUtil.create('div', 'map-colorbar');
        L.DomEvent.disableClickPropagation(div);
        div.innerHTML = `
          <div class="map-colorbar-title">Normalized shoreline change (2025→2050), m</div>
          <div class="map-colorbar-scale">
            <div class="map-colorbar-gradient"></div>
            <div class="map-colorbar-labels">
              <div>+${colorScaleLimit} (more accretion)</div>
              <div>0 (stable center)</div>
              <div>-${colorScaleLimit} (more erosion)</div>
            </div>
          </div>
          <div class="map-colorbar-note">Stability threshold: ±${STABILITY_THRESHOLD} m</div>
        `;
        return div;
      };
      control.addTo(map);
    }

    // Show projections when point is clicked
    function showProjections(transectId, properties) {
      currentTransectId = transectId;
      
      const transectData = projectionsData[transectId];
      if (!transectData) {
        alert('No projection data available for ' + transectId);
        return;
      }

      // Update header
      document.getElementById('panelTitle').textContent = transectId;
      const delta = normalizedChangeByTransect[transectId];
      const deltaLabel = Number.isFinite(delta)
        ? `${delta.toFixed(1)} m (${describeStability(delta)})`
        : 'n/a';
      document.getElementById('panelSubtitle').textContent = `Site: ${properties.site_id} | Normalized change 2025→2050: ${deltaLabel}`;

      // Compound-first display (fallback already resolved in activeScenarioKey)
      let html = '<div class="scenario-container">';
      html += `<div class="scenario-title">Scenario: ${activeScenarioKey || 'n/a'}</div>`;
      html += '<div class="chart-container"><canvas id="projectionChart"></canvas></div>';
      html += '<table class="data-table" id="dataTable"></table>';
      html += '<div class="legend">';
      html += '<div class="legend-item"><div class="legend-color" style="background: #2ca02c;"></div> Compound Projection</div>';
      html += '<div class="legend-item"><div class="legend-color" style="background: rgba(44, 160, 44, 0.30);"></div> Projection 5%-95% Range</div>';
      html += '<div class="legend-item"><div class="legend-color" style="background: deeppink;"></div> SLR Only</div>';
      html += '<div class="legend-item"><div class="legend-color" style="background: rgba(255, 20, 147, 0.22);"></div> SLR Only 5%-95% Range</div>';
      html += '<div class="legend-item"><div class="legend-color" style="background: #000;"></div> Trend Only</div>';
      html += '<div class="legend-item"><div class="legend-color" style="background: rgba(0, 0, 0, 0.16);"></div> Trend Only 5%-95% Range</div>';
      html += '<div class="legend-item"><div class="legend-color" style="background: #1f77b4;"></div> Satellite Observations</div>';
      html += '<div class="legend-item"><div class="legend-color" style="background: #ff7f0e;"></div> LOESS Historical Signal</div>';
      html += '</div>';
      html += '</div>';

      document.getElementById('panelBody').innerHTML = html;
      document.getElementById('infoPanel').classList.remove('hidden');

      // Update chart with compound/fallback scenario only
      updateChart(activeScenarioKey);

      // Highlight marker
      Object.values(markers).forEach(m => m.setStyle({ color: '#fff' }));
      if (markers[transectId]) {
        markers[transectId].setStyle({ color: '#007bff', weight: 3 });
      }
    }

    // Update chart based on selected scenario
    function updateChart(scenario) {
      const transectData = projectionsData[currentTransectId];
      const data = transectData.scenarios[scenario];

      if (!data || data.length === 0) {
        console.error('No data for scenario:', scenario);
        return;
      }

      const projectionData = data.filter(d => !d.series_type || d.series_type === 'projection');
      const observationData = data.filter(d => d.series_type === 'satellite_observation');
      const loessData = data.filter(d => d.series_type === 'loess_historical');

      if (projectionData.length === 0) {
        console.error('No projection rows found for scenario:', scenario);
        return;
      }

      // Prepare chart data
      const years = projectionData.map(d => Number(d.year));
      const baselineRow = projectionData.find(d => Number(d.year) === BASELINE_YEAR) || projectionData[0];
      const baselineProj = Number(baselineRow.proj_shoreline_mean);
      const baselineProjQ05 = Number(baselineRow.proj_shoreline_q05);
      const baselineProjQ95 = Number(baselineRow.proj_shoreline_q95);
      const baselineSlr = Number(baselineRow.slr_only_shoreline_mean);
      const baselineSlrQ05 = Number(baselineRow.slr_only_shoreline_q05);
      const baselineSlrQ95 = Number(baselineRow.slr_only_shoreline_q95);
      const baselineTrend = Number(baselineRow.trend_only_shoreline_mean);
      const baselineTrendQ05 = Number(baselineRow.trend_only_shoreline_q05);
      const baselineTrendQ95 = Number(baselineRow.trend_only_shoreline_q95);

      const projMean = projectionData.map(d => Number(d.proj_shoreline_mean) - baselineProj);
      const projQ05 = projectionData.map(d => Number(d.proj_shoreline_q05) - baselineProjQ05);
      const projQ95 = projectionData.map(d => Number(d.proj_shoreline_q95) - baselineProjQ95);
      const slrMean = projectionData.map(d => Number(d.slr_only_shoreline_mean) - baselineSlr);
      const slrQ05 = projectionData.map(d => Number(d.slr_only_shoreline_q05) - baselineSlrQ05);
      const slrQ95 = projectionData.map(d => Number(d.slr_only_shoreline_q95) - baselineSlrQ95);
      const trendMean = projectionData.map(d => Number(d.trend_only_shoreline_mean) - baselineTrend);
      const trendQ05 = projectionData.map(d => Number(d.trend_only_shoreline_q05) - baselineTrendQ05);
      const trendQ95 = projectionData.map(d => Number(d.trend_only_shoreline_q95) - baselineTrendQ95);

      const obsSeries = observationData
        .map(d => ({
          x: Number.isFinite(Number(d.year_decimal)) ? Number(d.year_decimal) : Number(d.year),
          y: Number(d.shoreline_position) - baselineProj
        }))
        .filter(d => Number.isFinite(d.x) && Number.isFinite(d.y))
        .sort((a, b) => a.x - b.x);

      const loessSeries = loessData
        .map(d => ({
          x: Number.isFinite(Number(d.year_decimal)) ? Number(d.year_decimal) : Number(d.year),
          y: Number(d.shoreline_position) - baselineProj
        }))
        .filter(d => Number.isFinite(d.x) && Number.isFinite(d.y))
        .sort((a, b) => a.x - b.x);

      const asXY = (values) => years.map((x, i) => ({ x, y: values[i] }));

      // Destroy previous chart if exists
      if (currentChart) {
        currentChart.destroy();
      }

      // Create new chart
      const ctx = document.getElementById('projectionChart').getContext('2d');
      currentChart = new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [
            {
              label: '_Projection Q05',
              data: asXY(projQ05),
              borderColor: 'rgba(44, 160, 44, 0)',
              backgroundColor: 'rgba(44, 160, 44, 0)',
              borderWidth: 0,
              pointRadius: 0,
              fill: false,
              tension: 0,
              spanGaps: true
            },
            {
              label: '5%-95% Range',
              data: asXY(projQ95),
              borderColor: 'rgba(44, 160, 44, 0)',
              backgroundColor: 'rgba(44, 160, 44, 0.30)',
              borderWidth: 0,
              pointRadius: 0,
              fill: '-1',
              tension: 0,
              spanGaps: true
            },
            {
              label: '_SLR Q05',
              data: asXY(slrQ05),
              borderColor: 'rgba(255, 20, 147, 0)',
              backgroundColor: 'rgba(255, 20, 147, 0)',
              borderWidth: 0,
              pointRadius: 0,
              fill: false,
              tension: 0,
              spanGaps: true
            },
            {
              label: 'SLR Only 5%-95% Range',
              data: asXY(slrQ95),
              borderColor: 'rgba(255, 20, 147, 0)',
              backgroundColor: 'rgba(255, 20, 147, 0.22)',
              borderWidth: 0,
              pointRadius: 0,
              fill: '-1',
              tension: 0,
              spanGaps: true
            },
            {
              label: '_Trend Q05',
              data: asXY(trendQ05),
              borderColor: 'rgba(0, 0, 0, 0)',
              backgroundColor: 'rgba(0, 0, 0, 0)',
              borderWidth: 0,
              pointRadius: 0,
              fill: false,
              tension: 0,
              spanGaps: true
            },
            {
              label: 'Trend Only 5%-95% Range',
              data: asXY(trendQ95),
              borderColor: 'rgba(0, 0, 0, 0)',
              backgroundColor: 'rgba(0, 0, 0, 0.16)',
              borderWidth: 0,
              pointRadius: 0,
              fill: '-1',
              tension: 0,
              spanGaps: true
            },
            {
              label: 'Compound Projection (Mean)',
              data: asXY(projMean),
              borderColor: '#2ca02c',
              backgroundColor: 'rgba(44, 160, 44, 0.22)',
              borderWidth: 2,
              fill: false,
              tension: 0.1,
              pointRadius: 2
            },
            {
              label: 'SLR Only (Mean)',
              data: asXY(slrMean),
              borderColor: 'deeppink',
              borderWidth: 2,
              fill: false,
              tension: 0.1,
              pointRadius: 1,
              borderDash: [6, 3]
            },
            {
              label: 'Trend Only (Mean)',
              data: asXY(trendMean),
              borderColor: '#000',
              borderWidth: 2,
              fill: false,
              tension: 0.1,
              pointRadius: 1,
              borderDash: [3, 3]
            },
            {
              label: 'Satellite Observations',
              data: obsSeries,
              borderColor: '#1f77b4',
              backgroundColor: '#1f77b4',
              borderWidth: 0,
              showLine: false,
              pointRadius: 2
            },
            {
              label: 'LOESS Historical Signal',
              data: loessSeries,
              borderColor: '#ff7f0e',
              backgroundColor: '#ff7f0e',
              borderWidth: 2,
              fill: false,
              tension: 0.1,
              pointRadius: 0
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              labels: {
                filter: (item) => !item.text.startsWith('_'),
                font: { size: 10 },
                boxWidth: 12
              }
            },
            title: {
              display: true,
              text: 'Normalized Shoreline Change: ' + scenario.replace(/_/g, ' '),
              font: { size: 12 }
            }
          },
          parsing: false,
          scales: {
            y: {
              title: {
                display: true,
                text: 'Shoreline Change from 2025 (m)'
              },
              font: { size: 10 }
            },
            x: {
              type: 'linear',
              title: {
                display: true,
                text: 'Year'
              },
              ticks: {
                callback: function(value) {
                  return Number(value).toFixed(0);
                }
              }
            }
          }
        }
      });

      // Update data table
      updateDataTable(projectionData);
    }

    // Update data table with projection values
    function updateDataTable(data) {
      const baselineRow = data.find(d => Number(d.year) === BASELINE_YEAR) || data[0];
      const baselineProj = Number(baselineRow.proj_shoreline_mean);
      const baselineQ05 = Number(baselineRow.proj_shoreline_q05);
      const baselineQ95 = Number(baselineRow.proj_shoreline_q95);
      let html = '<tr><th>Year</th><th>Mean</th><th>Q05</th><th>Q95</th></tr>';
      // Show every 5 years or all if dataset is small
      const step = data.length > 10 ? 5 : 1;
      for (let i = 0; i < data.length; i += step) {
        const d = data[i];
        const meanDelta = Number(d.proj_shoreline_mean) - baselineProj;
        const q05Delta = Number(d.proj_shoreline_q05) - baselineQ05;
        const q95Delta = Number(d.proj_shoreline_q95) - baselineQ95;
        html += `<tr>
          <td>${d.year.toFixed(0)}</td>
          <td>${meanDelta.toFixed(1)}</td>
          <td>${q05Delta.toFixed(1)}</td>
          <td>${q95Delta.toFixed(1)}</td>
        </tr>`;
      }
      document.getElementById('dataTable').innerHTML = html;
    }

    // Close info panel
    function closePanel() {
      document.getElementById('infoPanel').classList.add('hidden');
      Object.values(markers).forEach(m => m.setStyle({ color: '#fff', weight: 2 }));
      currentTransectId = null;
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', initMap);
  </script>

</body>
</html>
